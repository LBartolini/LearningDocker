services:
  alpine:
    image: alpine
    depends_on:
      router:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
    entrypoint: sh -c " 
      ip route del default; \ 
      ip route add default via 172.29.0.1 && \ 
      tail -f /dev/null "
    networks:
      office:
        ipv4_address: 172.29.0.2

  router:
    image: openwrt
    volumes:
      - ./router_config/bgpd.conf:/etc/quagga/bgpd.conf
      #- ./router_config/init.sh:/etc/uci-defaults/init.sh
      - ./router_config/firewall:/etc/config/firewall
      - ./router_config/network:/etc/config/network
      - ./router_config/rc.local:/etc/rc.local
      - ./router_config/firewall.user:/etc/firewall.user
    healthcheck:
      test: test -e /.started
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 30s
    privileged: true
    environment:
      PASSWORD_DEFAULT: admin123
    networks:
      office:
        ipv4_address: 172.29.0.1
      internet:
        ipv4_address: 172.30.0.2

networks:
  office:
    name: office
    driver: ipvlan
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24

  internet:
    name: internet
    driver: ipvlan
    driver_opts:
      parent: enp3s0
      ipvlan_mode: l3
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
