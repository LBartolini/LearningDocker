services:
  alpineA:
    image: alpine
    depends_on:
      router:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
    entrypoint: sh -c " 
      ip route add default via 172.29.0.1 && \ 
      tail -f /dev/null "
    dns:
      - "8.8.8.8"
    networks:
      office:
        ipv4_address: 172.29.0.2
  
  alpineB:
    image: alpine
    depends_on:
      router:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
    entrypoint: sh -c " 
      ip route add default via 172.28.0.1 && \ 
      tail -f /dev/null "
    dns:
      - "8.8.8.8"
    networks:
      factory:
        ipv4_address: 172.28.0.2

  router:
    build: .
    restart: unless-stopped
    volumes:
      - ./router_config/bgpd.conf:/etc/quagga/bgpd.conf
      - ./router_config/init.sh:/etc/uci-defaults/init.sh
      - ./router_config/firewall.user:/etc/firewall.user
    healthcheck:
      test: test -e /.started && (ping -c 4 8.8.8.8 > /dev/null 2>&1 || exit 1)
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    privileged: true
    environment:
      PASSWORD_DEFAULT: admin123
    networks:
      internet:
        ipv4_address: 172.30.0.2
      office:
        ipv4_address: 172.29.0.1
      factory:
        ipv4_address: 172.28.0.1

networks:
  office:
    name: office
    driver: macvlan
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24

  factory:
    name: factory
    driver: macvlan
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24

  internet:
    name: internet
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1